name: CI
on: [push, pull_request]

env:
  PIP_DEPS: pytest pytest-xdist

jobs:

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: deps
      run: |
        sudo apt-get -qq update
        sudo apt-get install -y clang-format cppcheck python3-pip python3-venv
        python3 -m venv "$HOME/.lint-venv"
        "$HOME/.lint-venv/bin/pip" install pre-commit $PIP_DEPS ruff
        echo "$HOME/.lint-venv/bin" >> "$GITHUB_PATH"
    - name: pre-commit
      run: pre-commit run --all-files

  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        BUILD_TYPE: [Debug, Release]
    steps:
    - uses: actions/checkout@v7
    - name: docker build
      run: docker build -t sqlite_web_vfs_tests --build-arg build_type=${{ matrix.BUILD_TYPE }} .
    - name: run tests
      run: docker run -e GITHUB_RUN_ID=$GITHUB_RUN_ID sqlite_web_vfs_tests

  macOS:
    runs-on: macos-15
    strategy:
      matrix:
        BUILD_TYPE: [Debug, Release]
    steps:
    - uses: actions/checkout@v7
    - name: dependencies
      run: |
        brew install python sqlite libmicrohttpd aria2
        $(brew --prefix)/bin/pip3 install --break-system-packages $PIP_DEPS
    - name: build
      run: |
        CXXFLAGS="-I$(brew --prefix)/include -I$(brew --prefix)/opt/sqlite/include" \
        LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix)/opt/sqlite/lib" \
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.BUILD_TYPE }} \
                -B build .
        cmake --build build -j 4
    - name: ctest
      run: |
        export PREFIX=$(brew --prefix)
        export PATH=$(ls -p1 ${PREFIX}/opt/python@*)/bin:$PATH
        cd build
        ctest -V
